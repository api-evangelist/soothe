x-coverage:
  state: gated
  reason: partner-login
  detail: >-
    Soothe's API host api.soothe.com 301s every path to a Rails/Devise session sign-in
    form (page title "Api | Log In") and returns that same login HTML for every URL
    including a random-path control, so no contract, reference or error shape is
    reachable without credentials; the only machine-readable document Soothe serves
    publicly is the auto-generated FastAPI schema of its self-hosted help-centre mirror at
    help.soothe.com, which describes page serving and a health check rather than the
    booking marketplace.
