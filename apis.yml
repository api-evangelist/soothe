aid: soothe
name: Soothe
description: 'Soothe is a Los Angeles-based on-demand wellness marketplace, founded in
  2013, that connects consumers and businesses with independent, licensed wellness
  professionals who deliver services at the customer''s own location. The marketplace
  covers massage (Swedish, deep tissue, sports, prenatal, chair, percussive,
  reflexology, lymphatic, acupressure, Thai and myofascial), facials and skincare, and
  hair and beauty services, booked through the Soothe consumer app and web booking
  flow and fulfilled through the separate Soothe for Providers app. Alongside the B2C
  business, Soothe runs a B2B practice covering corporate and employee wellness
  programs, hospitality and spa staffing, residential communities and event chair
  massage, plus a SoothePass subscription membership. It operates in 40+ US cities
  across roughly 32 states and Washington D.C., and internationally in Australia,
  Canada and the United Kingdom. Soothe publishes no public developer program: its API
  host, api.soothe.com, is a credentialed sign-in wall, and the partner booking
  platform it markets to hospitality and corporate customers is reached through a
  contact-sales form rather than public documentation.'
