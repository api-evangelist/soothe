scope_note: >-
  These conventions describe the ONLY contract Soothe publishes — the read-only
  help-centre mirror at help.soothe.com. They are not the conventions of the Soothe
  booking or marketplace API, which is not published: api.soothe.com 301s every request
  to a Rails/Devise sign-in form.
